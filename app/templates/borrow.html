{% extends "base.html" %}
{% block content %}
<h2 class="mb-3">Kitap ödünç al</h2>
{% set available = books | selectattr('is_borrowed', 'equalto', false) | list %}
{% if not members or not available %}
  <p class="empty-note mb-0">Ödünç vermek için en az bir üye ve rafta bir kitap gerekir.</p>
{% else %}
<form method="POST" class="row g-3">
  <div class="col-md-6">
    <label class="form-label">Üye</label>
    <select name="member_id" class="form-select" required>
      {% for member in members %}
        <option value="{{ member.member_id }}">{{ member.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-6">
    <label class="form-label">Kitap</label>
    <select name="title" class="form-select" required>
      {% for book in available %}
        <option value="{{ book.title }}">{{ book.title }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-12">
    <button type="submit" class="btn btn-primary">Ödünç al</button>
  </div>
</form>
{% endif %}
{% endblock %}
